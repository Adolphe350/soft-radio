services:
  soft-radio:
    build:
      context: .
      dockerfile: Dockerfile
    image: soft-radio:latest
    container_name: soft-radio
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
